# mergekit config for DIYA's merged model.
#
# All models listed here MUST be fine-tunes of the exact same base model
# (same architecture + tokenizer) or the merge will silently produce a
# broken model. Use ../scripts/find_compatible_models.py to find real
# candidates tagged with this base_model on Hugging Face, then replace
# the placeholders below.
#
# Run with:
#   pip install mergekit
#   mergekit-yaml merge/mergekit_config.yaml ./merged-model --cuda  (drop --cuda if CPU-only)

merge_method: dare_ties
base_model: meta-llama/Llama-3.2-3B-Instruct
models:
  - model: meta-llama/Llama-3.2-3B-Instruct
    parameters:
      weight: 1.0
      density: 1.0
  # - model: <replace-with-a-real-Llama-3.2-3B-Instruct-fine-tune>
  #   parameters:
  #     weight: 0.5
  #     density: 0.5
  # - model: <replace-with-another-compatible-fine-tune>
  #   parameters:
  #     weight: 0.5
  #     density: 0.5
dtype: bfloat16
tokenizer_source: base
